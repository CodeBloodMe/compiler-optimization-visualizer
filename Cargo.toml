[package]
name = "aegis"
version = "0.1.0"
edition = "2024"
authors = ["CodeBloodMe <krishkaushik5178@gmail.com>"]
description = "Aegis: Security-First, Resource-Bounded Compiler for WebAssembly"
license = "MIT"

[[bin]]
name = "aegis"
path = "src/main.rs"

[lib]
name = "aegis"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
wasm-encoder = "0.261"
wasmparser = "0.261"
wasmprinter = "0.261"
wasmtime = "49.0"
anyhow = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.17"
